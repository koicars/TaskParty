<style>
/* =========================================================
   PROJECTS — a clean, Apple-inspired productivity dashboard.
   Soft neutral surfaces, restrained accent colors, generous
   whitespace, activity-ring progress, glass modal.
   ========================================================= */

:root{
  --bg:            #f2efe6;
  --surface:       #fbfaf5;
  --surface-2:     #f5f3ea;
  --ink:           #1f2d21;
  --ink-soft:      #5c6656;
  --ink-faint:     #9a9c8e;
  --hairline:      rgba(31,45,33,.10);
  --hairline-soft: rgba(31,45,33,.06);

  /* ---- Card title / status-pill vertical tuning (2026-07 tuned values) ----
     Restore point: gap 2px, title -12px, pill -11px.
     Increase (toward 0) = move DOWN. Decrease = move UP.
     Note: .card-title-row shifts the pill with it; --card-pill-offset is
     the pill's extra offset ON TOP of the title's. */
  --card-title-pill-gap: 2px;
  --card-title-offset: -12px;
  --card-pill-offset: -11px;

  /* FocusAtlas brand palette */
  --forest:  #2e5e3d;  /* primary */
  --sage:    #7ea97f;  /* secondary */
  --brown:   #8b5e34;  /* accent */
  --olive:   #1f2d21;  /* deep */
  --stone:   #d3cbb3;  /* neutral */
  --paper:   #f7f5ef;  /* background */

  /* semantic aliases (kept so existing rules keep working) */
  --blue:    #2e5e3d;  /* primary action → forest green */
  --green:   #2e5e3d;
  --pink:    #b0503a;  /* "danger"/delayed → warm terracotta, on-brand */
  --gray:    #9a9c8e;
  --orange:  #8b5e34;  /* → earth brown */
  --purple:  #6b7f5e;  /* → muted olive-sage */

  --radius-xl: 26px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --ease: cubic-bezier(.28,.11,.32,1);
  --dur: 260ms;

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- subtle topographic paper texture ---------- */
/* =========================================================
   STATUS THEMES — swap the whole status palette at once.
   Applied via <html data-theme="...">, persisted per device.
   ========================================================= */
:root, [data-theme="atlas"]{
  --hp-green:#4a8f5c; --hp-yellow:#c9a24a; --hp-blue:#2e5e3d;
  --hp-red:#c25a42;   --hp-darkred:#8b4a34;
  --st-ok-bg:rgba(126,169,127,.16);   --st-ok-fg:#2e5e3d;
  --st-ahead-bg:rgba(46,94,61,.14);   --st-ahead-fg:#234b30;
  --st-late-bg:rgba(176,80,58,.16);   --st-late-fg:#9e4430;
  --st-late-tint:rgba(176,80,58,.12);
  --st-late-glow1:rgba(176,80,58,.08); --st-late-glow2:rgba(176,80,58,.14);
}
[data-theme="vivid"]{
  /* iOS-style neutral surfaces */
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#fbfbfd;
  --ink:#1d1d1f; --ink-soft:#6e6e73; --ink-faint:#a1a1a6;
  --hairline:rgba(0,0,0,.07); --hairline-soft:rgba(0,0,0,.045);
  --blue:#0a84ff; --green:#30d158; --pink:#ff375f;
  --gray:#8e8e93; --orange:#ff9f0a; --purple:#bf5af2;
  --hp-green:#42c766; --hp-yellow:#f0b429; --hp-blue:#4f9dff;
  --hp-red:#ff5a5f;   --hp-darkred:#8a1f2b;
  --st-ok-bg:rgba(48,209,88,.14);     --st-ok-fg:#1f8a43;
  --st-ahead-bg:rgba(10,132,255,.13); --st-ahead-fg:#0864c9;
  --st-late-bg:rgba(255,55,95,.14);   --st-late-fg:#d02348;
  --st-late-tint:rgba(255,55,95,.12);
  --st-late-glow1:rgba(255,55,95,.08); --st-late-glow2:rgba(255,55,95,.14);
}
/* Blue-orange axis: legible with deuteranopia / protanopia / tritanopia */
[data-theme="access"]{
  --hp-green:#0173b2; --hp-yellow:#8c9196; --hp-blue:#056dab;
  --hp-red:#e69f00;   --hp-darkred:#b8590a;
  --st-ok-bg:rgba(1,115,178,.14);     --st-ok-fg:#015a8c;
  --st-ahead-bg:rgba(5,109,171,.13);  --st-ahead-fg:#014a75;
  --st-late-bg:rgba(230,159,0,.20);   --st-late-fg:#8a5e00;
  --st-late-tint:rgba(230,159,0,.14);
  --st-late-glow1:rgba(230,159,0,.10); --st-late-glow2:rgba(230,159,0,.16);
}
/* Value-only: distinguishes purely by lightness */
[data-theme="mono"]{
  /* pure white paper: neutralise the warm base and the card surface */
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f6f6f6;
  --hairline:rgba(0,0,0,.10); --hairline-soft:rgba(0,0,0,.06);
  --hp-green:#8c918a; --hp-yellow:#5f645d; --hp-blue:#9aa096;
  --hp-red:#33372f;   --hp-darkred:#1d2019;
  --st-ok-bg:rgba(31,45,33,.08);      --st-ok-fg:#4a5147;
  --st-ahead-bg:rgba(31,45,33,.06);   --st-ahead-fg:#5c6656;
  --st-late-bg:rgba(255,0,0,.34);    --st-late-fg:#9c0000;
  --st-late-tint:rgba(255,0,0,.16);
  --st-late-glow1:rgba(255,0,0,.16); --st-late-glow2:rgba(255,0,0,.26);
}

/* mono: plain white paper — no contour texture at all */
[data-theme="mono"] .bg-texture{ display:none; }

/* ---------- misty mountain horizon (hero atmosphere) ---------- */
.bg-mountains{ display:none; }

/* ---------- ambient background blobs ---------- */
.bg-blobs{ display:none; }

/* vivid: iOS-style paper with drifting pastel blobs, no contour map */
[data-theme="vivid"] .bg-texture{ display:none; }
[data-theme="vivid"] .bg-blobs{ display:block; }
[data-theme="vivid"] .blob{ opacity:.35; }
[data-theme="vivid"] .blob.b1{ background: radial-gradient(circle, #7dc4ff, transparent 70%); }
[data-theme="vivid"] .blob.b2{ background: radial-gradient(circle, #ffb0c9, transparent 70%); }
[data-theme="vivid"] .blob.b3{ background: radial-gradient(circle, #d0b3ff, transparent 70%);
  bottom:-160px; left:30%; opacity:.35; }
.blob{
  position:absolute;
  border-radius:50%;
  filter: blur(90px);
  opacity:.32;
  animation: drift 22s ease-in-out infinite;
}
.blob.b1{ width:520px; height:520px; background: radial-gradient(circle, #7ea97f, transparent 70%); top:-160px; left:-120px; animation-duration: 26s; }
.blob.b2{ width:460px; height:460px; background: radial-gradient(circle, #c9bfa2, transparent 70%); top:120px; right:-140px; animation-duration: 30s; animation-delay: -6s; }
.blob.b3{ width:420px; height:420px; background: radial-gradient(circle, #b58a5e, transparent 72%); bottom:34%; left:30%; animation-duration: 24s; animation-delay: -12s; opacity:.16; }
@keyframes drift{
  0%,100%{ transform: translate(0,0) scale(1); }
  50%{ transform: translate(30px,-24px) scale(1.06); }
}
@media (prefers-reduced-motion: reduce){ .blob{ animation:none; } }

/* ---------- layout shell ---------- */
.app{
  position:relative; z-index:3;
  max-width:1180px;
  margin:0 auto;
  padding: 48px 28px 90px;
}

.title-plate{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:20px; flex-wrap:wrap;
  margin-bottom:34px; padding-right:132px;
  animation: fadeUp 520ms var(--ease) both;
}
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
.title-block h1{
  font-size: 26px;
  font-weight:800;
  letter-spacing:-0.02em;
  margin:0 0 3px;
  color: var(--ink);
}
.title-block p{ margin:0; font-size:12.5px; color: var(--ink-soft); font-weight:400; letter-spacing:.01em; }

.header-actions{ display:flex; align-items:center; gap:6px; flex-wrap:nowrap; min-width:0; }

.save-indicator{
  display:flex; align-items:center; gap:6px;
  font-size:11.5px; font-weight:600;
  color: var(--ink-soft);
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(14px);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 6px 12px;
  white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis;
}
.save-dot{ width:6px; height:6px; border-radius:50%; background: var(--green); box-shadow: 0 0 0 3px rgba(126,169,127,.18); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* ---------- cloud sync (Firebase) ---------- */
.sync-btn{
  display:flex; align-items:center; gap:6px;
  font-family: var(--font); font-size:11.5px; font-weight:600;
  color: var(--ink-soft);
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(14px);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 6px 11px;
  white-space:nowrap; flex:0 0 auto;
  cursor:pointer;
  transition: background 140ms var(--ease), color 140ms var(--ease);
}
.sync-btn:hover{ background: rgba(255,255,255,.95); }
.sync-btn.connected{ color: var(--blue); }
.sync-dot{ width:6px; height:6px; border-radius:50%; background: var(--ink-faint); }
.sync-btn.connected .sync-dot{ background: var(--blue); box-shadow: 0 0 0 3px rgba(46,94,61,.18); }

.sync-popover{
  position:fixed; z-index:120;
  width:min(300px, calc(100vw - 24px));
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--hairline);
  border-radius: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,.22);
  padding:16px;
  display:none;
  opacity:0; transform: scale(.94) translateY(-4px);
  transition: opacity 160ms var(--ease), transform 160ms var(--ease);
}
.sync-popover.open{ display:block; opacity:1; transform: scale(1) translateY(0); }
.sync-desc{ font-size:12.5px; line-height:1.6; color: var(--ink-soft); margin:0 0 10px; }
.sync-input{
  width:100%; border:1px solid var(--hairline); outline:none; background: var(--surface-2);
  font-family: var(--font); font-size:13.5px; color: var(--ink); border-radius:10px; padding:10px 12px;
  margin-bottom:10px;
  transition: border-color 140ms var(--ease);
}
.sync-input:focus{ border-color: var(--blue); }
.sync-actions{ display:flex; justify-content:flex-end; gap:8px; }
.sync-action-btn{
  border:none; cursor:pointer; font-family: var(--font); font-size:13px; font-weight:600;
  padding:9px 15px; border-radius:10px;
  transition: background 140ms var(--ease), transform 140ms var(--ease);
}
.sync-disconnect{ background: rgba(0,0,0,.06); color: var(--ink-soft); }
.sync-disconnect:hover{ background: rgba(0,0,0,.1); }
.sync-connect{ background: var(--blue); color:#fff; }
.sync-connect:hover{ transform: translateY(-1px); background:#24492f; }
.sync-status{ font-size:11.5px; color: var(--ink-faint); margin-top:10px; min-height:14px; }

.sync-loading-overlay{
  position:fixed; inset:0; z-index:130;
  display:none; align-items:center; justify-content:center;
  background: rgba(245,245,247,.88);
  backdrop-filter: blur(6px);
}
.sync-loading-overlay.show{ display:flex; }
.sync-loading-box{ display:flex; flex-direction:column; align-items:center; gap:12px; font-size:13.5px; font-weight:600; color: var(--ink-soft); }
.sync-spinner{
  width:26px; height:26px; border-radius:50%;
  border:3px solid rgba(46,94,61,.18); border-top-color: var(--blue);
  animation: spin 800ms linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ---------- project grid ---------- */
.grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
@media (max-width: 980px){ .grid{ grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px){ .grid{ grid-template-columns: 1fr; } }

/* ---------- Projects / All To-Dos: title itself is the switcher ---------- */
.page-title-btn{
  display:flex; align-items:center; gap:8px;
  border:none; background:transparent; cursor:pointer;
  padding:0; margin:0 0 3px;
}
.page-title-btn h1{ margin:0 0 0; line-height:1.1; transition: color 200ms var(--ease); }
.page-title-swap-icon{
  width:16px; height:16px; margin-top:2px;
  color: var(--ink-faint);
  opacity:.35;
  transform: translateY(-2px);
  transition: opacity 200ms var(--ease), transform 200ms var(--ease), color 200ms var(--ease);
}
.page-title-btn:hover h1{ color: var(--blue); }
.page-title-btn:hover .page-title-swap-icon{ opacity:1; color: var(--blue); transform: translateY(1px); }
.page-title-btn:active .page-title-swap-icon{ transform: translateY(3px) scale(.9); }

/* ---------- All To-Dos view ---------- */
.all-todos-view{ padding: 0 28px 28px; }
.alltodos-selector{
  display:flex; gap:2px; flex-wrap:wrap;
  padding:4px; margin-bottom:16px;
  background: rgba(118,118,128,.12);
  border-radius: 16px;
}
.alltodos-tab{
  flex:1 1 auto;
  font-size:12.5px; font-weight:700;
  padding:9px 10px;
  cursor:pointer;
  border-radius: 12px;
  border:none;
  background: transparent;
  color: var(--ink-soft);
  white-space:nowrap;
  transition: background 180ms var(--ease), color 180ms var(--ease), box-shadow 180ms var(--ease);
}
.alltodos-tab.active{ background:#fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.alltodos-big-list{ display:flex; flex-direction:column; gap:6px; }

.alltodos-item.done .ck{ background: var(--blue); border-color: var(--blue); }
.alltodos-complete-btn{

.alltodos-complete-btn:hover{ color: var(--green); transform: scale(1.12); }
.alltodos-complete-btn:active{ transform: scale(.94); }

.alltodos-item .txt{ flex:1; min-width:0; font-size:13.5px; font-weight:500; color: var(--ink); border-radius:5px; padding:1px 3px; margin:-1px -3px; }
.alltodos-item .txt:hover{ background: rgba(46,94,61,.10); }
.alltodos-text-input{
  width:100%; box-sizing:border-box; border:1px solid var(--blue); outline:none;
  background: var(--surface); font-family: var(--font); font-size:13.5px; font-weight:500;
  color: var(--ink); border-radius:6px; padding:2px 6px;
}
.alltodos-item.done .txt{ color: var(--ink-faint); text-decoration:line-through; }
.alltodos-item.done .txt:has(.alltodos-text-input){ text-decoration:none; }
.alltodos-text-input{ text-decoration:none; }
.alltodos-item .proj-tag{
  flex:0 0 auto; display:flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; color: var(--ink-soft);
  padding:4px 9px; border-radius:999px; background: rgba(0,0,0,.045);

}
.alltodos-item .proj-dot{ flex:0 0 auto; width:7px; height:7px; border-radius:50%; }
.alltodos-item .proj-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.alltodos-grid4{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
@media (max-width:640px){ .alltodos-grid4{ grid-template-columns:1fr; } }
.alltodos-quad-panel{
  background: var(--surface); border:1px solid var(--hairline-soft); border-radius: var(--radius-lg);
  padding:14px;
}
.alltodos-quad-title{ font-size:12.5px; font-weight:800; margin-bottom:10px; color: var(--ink); }
.alltodos-quad-panel .alltodos-item{ padding:8px 10px; border-radius:9px; }
.alltodos-quad-panel .alltodos-big-list{ gap:5px; }

.card{
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--hairline-soft);
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.045);
  padding: 12px 14px;
  cursor:pointer;
  display:flex; flex-direction:row; align-items:center; gap:12px;
  min-height: 0;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  animation: cardIn 460ms var(--ease) both;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.grid .card:nth-child(1){ animation-delay: 30ms; }
.grid .card:nth-child(2){ animation-delay: 80ms; }
.grid .card:nth-child(3){ animation-delay: 130ms; }
.grid .card:nth-child(4){ animation-delay: 180ms; }
.grid .card:nth-child(5){ animation-delay: 230ms; }
.grid .card:nth-child(6){ animation-delay: 280ms; }
@keyframes cardIn{ from{ opacity:0; transform: translateY(10px) scale(.985); } to{ opacity:1; transform: translateY(0) scale(1);} }
.card:hover{ transform: translateY(-3px); box-shadow: 0 3px 8px rgba(0,0,0,.05), 0 12px 24px rgba(0,0,0,.07); }
.card.sort-active{
  position:relative; z-index:70;
  box-shadow: 0 24px 46px rgba(0,0,0,.22), 0 4px 10px rgba(0,0,0,.1);
  transform: scale(1.045);
  cursor:grabbing;
  transition: box-shadow 150ms var(--ease);
}
.card.sort-target{ box-shadow: inset 0 0 0 3px var(--blue), 0 4px 10px rgba(0,0,0,.06); }
.card:active{ transform: translateY(-1px) scale(.994); }

.completed-row.sort-active{
  position:relative; z-index:70; background: var(--surface);
  box-shadow: 0 16px 32px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
  border-radius:10px; cursor:grabbing;
}
.completed-row.sort-target{ box-shadow: inset 0 0 0 2px var(--blue); border-radius:10px; }

.completed-section.drop-zone-active{
  min-height:64px; border-radius: var(--radius-lg);
  transition: background 140ms var(--ease), box-shadow 140ms var(--ease);
}
.completed-section.drop-zone-active:not(.drop-hover){
  background: rgba(0,0,0,.015);
  box-shadow: inset 0 0 0 1.5px dashed var(--hairline);
}
.completed-section.drop-zone-active.drop-hover{
  background: rgba(126,169,127,.08);
  box-shadow: inset 0 0 0 2px var(--green);
}
.completed-section.drop-zone-active:empty::before{
  content:'ここにドラッグして完了にする';
  display:flex; align-items:center; justify-content:center;
  height:64px; font-size:12.5px; font-weight:600; color: var(--ink-faint);
}

.grid.drop-zone-active{ position:relative; }
.grid.drop-zone-active::after{
  content:''; grid-column:1/-1; grid-row:1/-1;
  position:absolute; inset:-8px; border-radius: var(--radius-lg);
  pointer-events:none; transition: background 140ms var(--ease), box-shadow 140ms var(--ease);
  box-shadow: inset 0 0 0 1.5px dashed var(--hairline);
}
.grid.drop-zone-active.drop-hover::after{
  background: rgba(46,94,61,.05);
  box-shadow: inset 0 0 0 2px var(--blue);
}

/* ---------- status-based card tint (3 rule-based statuses) ---------- */
.card.st-delayed{ background: var(--st-late-tint); }
.card.st-delayed:hover{ box-shadow: 0 3px 8px var(--st-late-glow1), 0 12px 26px var(--st-late-glow2); }

.card-icon{
  width:36px; height:36px; border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  flex:0 0 auto;
  border:none; cursor:pointer; padding:0;
  position:relative;
  color:#fff;
  transition: transform 140ms var(--ease), filter 140ms var(--ease);
}
.card-icon:hover{ transform: scale(1.06); filter: brightness(1.06); }
.card-icon svg{ width:19px; height:19px; pointer-events:none; }
.card-icon::after{
  content:"";
  position:absolute; inset:-3px;
  border-radius:12px;
  box-shadow: 0 0 0 2px rgba(0,0,0,0);
  transition: box-shadow 140ms var(--ease);
}
.card-icon:hover::after{ box-shadow: 0 0 0 2px rgba(0,0,0,.08); }

/* ---------- Pokémon-style HP bar (percentage indicator) ---------- */
.hp-track{
  position:relative; width:100%; background: rgba(0,0,0,.09);
  border-radius:999px; overflow:hidden;
}
.hp-fill{
  height:100%; width:0%; border-radius:999px;
  transition: width 900ms var(--ease), background 300ms var(--ease);
  position:relative;
}
.hp-fill::after{
  content:""; position:absolute; inset:0 0 55% 0;
  background: rgba(255,255,255,.32);
  border-radius:999px 999px 0 0;
}
.hp-green{ background:var(--hp-green); }
.hp-yellow{ background:var(--hp-yellow); }
.hp-blue{ background:var(--hp-blue); }
.hp-red{ background:var(--hp-red); }
.hp-darkred{ background:var(--hp-darkred); }
.hp-empty{ background:transparent; }
.hp-track-empty{
  background-color:transparent;
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.15) 0 4px, transparent 4px 8px);
}

.hp-mini{ display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:5px; flex:0 0 auto; width:58px; align-self:center; }
.hp-mini .hp-pct{
  font-size:12.5px; font-weight:800; letter-spacing:-0.02em; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.hp-mini .hp-track{ width:100%; height:7px; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.07); }

.card-body{ flex:1; min-width:0; align-self:center; display:flex; flex-direction:column; justify-content:center; gap: var(--card-title-pill-gap); }

.card-title-row{ display:flex; align-items:center; gap:5px; line-height:1; margin-top: var(--card-title-offset); }
.card-title{
  font-size:14px; font-weight:700; letter-spacing:-0.01em; color: var(--ink); cursor:text;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
}
.card-title-input{
  font-family: var(--font); font-size:14px; font-weight:700; letter-spacing:-0.01em; color: var(--ink);
  border:none; outline:none; background: rgba(0,0,0,.045); border-radius:6px; padding:1px 5px; width:100%;
}
.title-edit-btn{
  flex:0 0 auto; width:14px; height:14px; border:none; background:transparent; cursor:pointer;
  color: var(--ink-faint); opacity:0; transition: opacity 140ms var(--ease), color 140ms var(--ease);
  display:flex; align-items:center; justify-content:center; padding:0;
}
.card:hover .title-edit-btn{ opacity:1; }
.title-edit-btn:hover{ color: var(--blue); }
.title-edit-btn svg{ width:11px; height:11px; }

.status-pill{
  flex:0 0 auto;
  align-self:flex-start;
  font-size:9.5px; font-weight:600;
  padding:1.5px 8px;
  border-radius:999px;
  white-space:nowrap;
  line-height:1.1;
  margin-top: var(--card-pill-offset);
}

/* ---------- accent color utilities ---------- */
.acc-blue    .card-icon{ background: var(--blue); }
.acc-green   .card-icon{ background: var(--green); }
.acc-pink    .card-icon{ background: var(--pink); }
.acc-gray    .card-icon{ background: var(--gray); }
.acc-orange  .card-icon{ background: var(--orange); }
.acc-purple  .card-icon{ background: var(--purple); }

/* ---------- status-based pill colors (3 rule-based statuses) ---------- */
.status-pill.st-ontrack{ background: var(--st-ok-bg);   color: var(--st-ok-fg); }
.status-pill.st-ahead{   background: var(--st-ahead-bg); color: var(--st-ahead-fg); }
.status-pill.st-delayed{ background: var(--st-late-bg); color: var(--st-late-fg); }

.pulse-update{ animation: pulseUpdate 420ms var(--ease); }
@keyframes pulseUpdate{ 0%{ transform:scale(1);} 40%{ transform:scale(1.015);} 100%{ transform:scale(1);} }

/* ---------- icon picker popover ---------- */
.icon-popover{
  position:fixed; z-index:90;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--hairline);
  border-radius: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,.18);
  padding:10px;
  display:none;
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  opacity:0; transform: scale(.94) translateY(-4px);
  transition: opacity 160ms var(--ease), transform 160ms var(--ease);
}
.icon-popover.open{ display:block; opacity:1; transform: scale(1) translateY(0); }
.icon-popover-grid{ display:grid; grid-template-columns: repeat(6, 34px); gap:6px; }
.icon-swatch{
  width:34px; height:34px; border-radius:10px; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  background: rgba(0,0,0,.05);
  color: var(--ink-soft);
  transition: transform 120ms var(--ease), background 120ms var(--ease), color 120ms var(--ease);
}
.icon-swatch:hover{ transform: scale(1.08); background: rgba(0,0,0,.09); }
.icon-swatch.selected{ background: var(--swatch-accent, var(--blue)); color:#fff; }
.icon-swatch svg{ width:17px; height:17px; }

/* ---------- freely-selectable icon color ---------- */
.color-swatch-row{ display:grid; grid-template-columns: repeat(6, 34px); gap:6px; justify-items:center; align-items:center; }
.color-swatch{
  width:26px; height:26px; border-radius:50%; border:2px solid rgba(0,0,0,.06); cursor:pointer; padding:0;
  transition: transform 120ms var(--ease), box-shadow 120ms var(--ease);
}
.color-swatch:hover{ transform: scale(1.14); }
.color-swatch.selected{ box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.color-swatch-custom{
  position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
  background: conic-gradient(from 0deg, #ff3b30, #ff9500, #ffcc00, #34c759, #00c7be, #30b0ff, #5856d6, #af52de, #ff2d55, #ff3b30);
}
.color-native-input{ position:absolute; inset:-6px; width:calc(100% + 12px); height:calc(100% + 12px); opacity:0; cursor:pointer; border:none; padding:0; }
.color-swatch-empty{
  width:26px; height:26px; border-radius:50%;
  border:1.5px dashed var(--hairline); box-sizing:border-box;
}

/* ---------- theme picker ---------- */

@media (max-width:380px){
  .header-actions{ gap:4px; }
  .sync-btn, .save-indicator{ font-size:10.5px; padding:5px 9px; gap:5px; }
  .title-plate{ padding-right:66px; }
}

.theme-tag{
  position:fixed; z-index:40;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + 14px);

  font-family: var(--font); font-size:12.5px; font-weight:600;
  color: var(--ink-soft);

  border-radius: 999px;
  padding: 8px 13px;

  transition: background 160ms var(--ease), transform 160ms var(--ease), box-shadow 160ms var(--ease);
}
.theme-tag:hover{ background: rgba(255,255,255,.95); transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(31,45,33,.12); }
.theme-tag:active{ transform: translateY(0) scale(.97); }
.theme-tag:focus-visible{ outline:2px solid var(--forest); outline-offset:2px; }
@media (max-width:520px){
  .title-plate{ padding-right:74px; }

  .theme-tag #themeBtnLabel{ display:none; }   /* dots alone on small screens */
}
.theme-dots{ display:flex; gap:3px; }
.theme-dots i{ width:7px; height:7px; border-radius:50%; display:block; }
.theme-popover{
  position:fixed; z-index:120; width:min(268px, calc(100vw - 24px));

  transition: opacity 160ms var(--ease), transform 160ms var(--ease);
}
.theme-popover.open{ display:block; opacity:1; transform: scale(1) translateY(0); }
.theme-list{ display:flex; flex-direction:column; gap:4px; margin-top:8px; }
.theme-opt{
  display:flex; align-items:center; gap:10px; width:100%;
  border:1px solid transparent; background:transparent; cursor:pointer;
  padding:9px 10px; border-radius:11px; font-family:inherit; text-align:left;
  transition: background 140ms var(--ease), border-color 140ms var(--ease);
}
.theme-opt:hover{ background: rgba(46,94,61,.05); }
.theme-opt.active{ background: rgba(46,94,61,.08); border-color: rgba(46,94,61,.22); }
.theme-swatch{ display:flex; gap:3px; flex:0 0 auto; }
.theme-swatch i{ width:11px; height:11px; border-radius:50%; display:block; }
.theme-opt-text{ flex:1; min-width:0; }
.theme-opt-name{ font-size:13px; font-weight:700; color: var(--ink); }
.theme-opt-desc{ font-size:11px; color: var(--ink-faint); margin-top:1px; }
.theme-check{ flex:0 0 auto; width:15px; height:15px; color: var(--forest); opacity:0; }
.theme-opt.active .theme-check{ opacity:1; }
.theme-note{ font-size:11px; line-height:1.6; color: var(--ink-faint); margin:12px 0 0; }

/* ---------- click-to-edit item popover (milestones / timeline / to-do items) ---------- */
.item-popover{
  position:fixed; z-index:95;
  width:min(280px, calc(100vw - 24px));
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid var(--hairline);
  border-radius: 16px;
  box-shadow: 0 18px 44px rgba(0,0,0,.2);
  padding:14px;
  display:none;
  opacity:0; transform: scale(.94) translateY(-4px);
  transition: opacity 160ms var(--ease), transform 160ms var(--ease);
}
.item-popover.open{ display:block; opacity:1; transform: scale(1) translateY(0); }
.pop-label{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color: var(--ink-faint); margin:0 0 5px; }
.pop-label:not(:first-child){ margin-top:12px; }
.pop-input{
  width:100%; border:1px solid var(--hairline); outline:none; background: var(--surface-2);
  font-family: var(--font); font-size:14px; color: var(--ink); border-radius:9px; padding:9px 11px;
  transition: border-color 140ms var(--ease);
}
.pop-input:focus{ border-color: var(--blue); }
.pop-tabbar{ display:flex; gap:4px; padding:3px; margin-bottom:10px; background: rgba(118,118,128,.12); border-radius:9px; }
.pop-tab-btn{
  flex:1; font-family: var(--font); font-size:11.5px; font-weight:600;
  padding:6px 8px; border:none; cursor:pointer; border-radius:7px;
  background:transparent; color: var(--ink-soft);
  transition: background 140ms var(--ease), color 140ms var(--ease), box-shadow 140ms var(--ease);
}
.pop-tab-btn.active{ background:#fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.pop-tab-panel{ display:none; }
.pop-tab-panel.active{ display:block; }
.pop-textarea{ resize:vertical; min-height:80px; line-height:1.5; }
.pop-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
.pop-btn{ border:none; cursor:pointer; font-family: var(--font); font-size:13px; font-weight:600; padding:8px 14px; border-radius:9px; transition: background 140ms var(--ease), transform 140ms var(--ease); }
.pop-btn-del{ background: rgba(176,80,58,.1); color: var(--pink); }
.pop-btn-del:hover{ background: rgba(176,80,58,.18); }
.pop-btn[data-action="pop-cancel"]{ background: rgba(142,142,147,.12); color: var(--ink-soft); }
.pop-btn[data-action="pop-cancel"]:hover{ background: rgba(142,142,147,.2); }
.pop-btn-done{ background: var(--ink); color:#fff; }
.pop-btn-done:hover{ transform: translateY(-1px); background: var(--blue); }

/* ---------- display-mode rows (tap to edit, long-press to reorder) ---------- */
.edit-row{
  cursor:pointer; transition: background 140ms var(--ease);
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.edit-row:hover{ background: rgba(46,94,61,.05); }
.edit-row-main{ flex:1; min-width:0; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.edit-row-title{ font-size:13.5px; font-weight:500; color: var(--ink); }
.edit-row-title.done{ color: var(--ink-faint); text-decoration: line-through; }
.edit-row-date{
  font-size:11.5px; font-weight:600; color: var(--ink-faint); flex:0 0 auto;
  padding:2px 7px; border-radius:7px; border:1.5px solid transparent;
  transition: border-color 140ms var(--ease), color 140ms var(--ease), background 140ms var(--ease);
}
.edit-row-date:hover{ border-color: var(--blue); color: var(--blue); background: rgba(46,94,61,.06); }
.quad-text{ cursor:text; }
.quad-item:hover{ background: rgba(255,255,255,.95); }
.quad-item{ touch-action:none; user-select:none; -webkit-user-select:none; }

/* ---------- long-press pop-out + drag-to-reorder ---------- */
.edit-row.sort-active, .quad-item.sort-active, .ms-item-wrap.sort-active{
  position:relative; z-index:70;
  background:#fff;
  box-shadow: 0 16px 32px rgba(0,0,0,.2), 0 2px 6px rgba(0,0,0,.1);
  transform: scale(1.035);
  transition: box-shadow 150ms var(--ease), transform 150ms var(--ease);
  cursor:grabbing;
}
.edit-row.sort-shift, .quad-item.sort-shift, .ms-item-wrap.sort-shift{ transition: transform 180ms var(--ease); }
.reorder-hint{
  position:fixed; z-index:96;
  background: var(--ink); color:#fff;
  font-size:12px; font-weight:600;
  padding:8px 14px; border-radius:999px;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
  opacity:0; pointer-events:none;
  transition: opacity 160ms var(--ease);
}
.reorder-hint.show{ opacity:1; }

/* ---------- custom confirm dialog (native confirm() is blocked in sandboxed previews) ---------- */
.confirm-overlay{
  position:fixed; inset:0; z-index:110;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  opacity:0; pointer-events:none;
  transition: opacity 180ms var(--ease);
}
.confirm-overlay.open{ opacity:1; pointer-events:auto; }
.confirm-scrim{ position:absolute; inset:0; background: rgba(20,20,22,.42); backdrop-filter: blur(4px); }
.confirm-box{
  position:relative;
  width:min(340px, 100%);
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(24px) saturate(1.4);
  border-radius:20px;
  border:1px solid rgba(255,255,255,.6);
  box-shadow: 0 24px 60px rgba(0,0,0,.28);
  padding:22px 20px 18px;
  transform: scale(.94) translateY(10px);
  transition: transform 220ms var(--ease);
}
.confirm-overlay.open .confirm-box{ transform: scale(1) translateY(0); }
.confirm-msg{ font-size:14px; line-height:1.7; color: var(--ink); white-space:pre-line; margin-bottom:18px; }
.confirm-actions{ display:flex; justify-content:flex-end; gap:8px; }
.confirm-btn{
  border:none; cursor:pointer; font-family: var(--font); font-size:13.5px; font-weight:600;
  padding:9px 16px; border-radius:10px;
  transition: background 140ms var(--ease), transform 140ms var(--ease);
}
.confirm-cancel{ background: rgba(0,0,0,.06); color: var(--ink-soft); }
.confirm-cancel:hover{ background: rgba(0,0,0,.1); }
.confirm-ok{ background: var(--pink); color:#fff; }
.confirm-ok:hover{ transform: translateY(-1px); background:#e0244a; }

@media (max-width:480px){
  .edit-add-row, .quad-add-row{ flex-wrap:wrap; }
  .edit-add-input.date{ flex:1 1 90px; }
  .edit-add-input.grow{ flex:1 1 100%; order:-1; }
  /* icon-date stays a fixed square; title keeps the full row */
  .edit-add-input.date.icon-date{ flex:0 0 26px; }
  .edit-add-row:has(.icon-date){ flex-wrap:nowrap; }
  .edit-add-row:has(.icon-date) .edit-add-input.grow{ flex:1 1 auto; order:0; }
}

/* =========================================================
   DETAIL OVERLAY
   ========================================================= */
.overlay{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
  opacity:0; pointer-events:none;
  transition: opacity var(--dur) var(--ease);
}
.overlay.open{ opacity:1; pointer-events:auto; }
.overlay-scrim{ position:absolute; inset:0; background: rgba(20,20,22,.42); backdrop-filter: blur(6px); }

.dialog{
  position:relative;
  width:min(880px, 100%);
  max-height:88vh;
  background: rgba(255,255,255,.86);
  backdrop-filter: blur(28px) saturate(1.4);
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,.6);
  box-shadow: 0 30px 80px rgba(0,0,0,.28);
  display:flex; flex-direction:column;
  transform: scale(.94) translateY(16px);
  opacity:0;
  transition: transform 320ms var(--ease), opacity 320ms var(--ease);
  overflow:hidden;
}
.overlay.open .dialog{ transform: scale(1) translateY(0); opacity:1; }

.dialog-head{ display:flex; align-items:center; gap:14px; padding:24px 28px 16px; }
.dialog-icon{
  width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  border:none; cursor:pointer; padding:0; position:relative;
  color:#fff;
  transition: transform 140ms var(--ease), filter 140ms var(--ease);
}
.dialog-icon:hover{ transform: scale(1.05); filter: brightness(1.06); }
.dialog-icon svg{ width:24px; height:24px; pointer-events:none; }
.dialog-title-row{ display:flex; align-items:center; gap:8px; margin:0 0 4px; }
.dialog-titles h2{ font-size:20px; font-weight:800; letter-spacing:-0.01em; margin:0; cursor:text; }
.dialog-title-input{
  font-family: var(--font); font-size:20px; font-weight:800; letter-spacing:-0.01em; color: var(--ink);
  border:none; outline:none; background: rgba(0,0,0,.045); border-radius:8px; padding:3px 8px;
}
.dialog-title-edit-btn{
  flex:0 0 auto; width:22px; height:22px; border:none; background:transparent; cursor:pointer;
  color: var(--ink-faint); transition: color 140ms var(--ease);
  display:flex; align-items:center; justify-content:center; padding:0;
}
.dialog-title-edit-btn:hover{ color: var(--blue); }
.dialog-title-edit-btn svg{ width:14px; height:14px; }
.dialog-titles p{ margin:0; font-size:13px; color: var(--ink-soft); font-weight:500; }
.dialog-head-actions{ margin-left:auto; display:flex; align-items:center; gap:6px; }
.complete-project-btn{
  width:30px; height:30px; border-radius:50%;
  border:none; cursor:pointer;
  background: rgba(0,0,0,.06);
  color: var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
  transition: background 160ms var(--ease), color 160ms var(--ease);
}
.complete-project-btn:hover{ background: rgba(126,169,127,.15); color: var(--green); }
.complete-project-btn.is-completed{ background: rgba(126,169,127,.15); color: var(--green); }
.complete-project-btn svg{ width:15px; height:15px; }
.delete-project-btn{
  width:30px; height:30px; border-radius:50%;
  border:none; cursor:pointer;
  background: rgba(0,0,0,.06);
  color: var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
  transition: background 160ms var(--ease), color 160ms var(--ease);
}
.delete-project-btn:hover{ background: rgba(176,80,58,.13); color: var(--pink); }
.delete-project-btn svg{ width:15px; height:15px; }
.close-btn{
  width:30px; height:30px; border-radius:50%;
  border:none; cursor:pointer;
  background: rgba(0,0,0,.06);
  color: var(--ink-soft);
  display:flex; align-items:center; justify-content:center;
  transition: background 160ms var(--ease), transform 160ms var(--ease), color 160ms var(--ease);
}
.close-btn svg{ width:16px; height:16px; }
.close-btn:hover{ background: rgba(0,0,0,.1); color: var(--ink); transform: translateY(2px); }

/* ---------- empty project slot (frame remains after deletion) ---------- */
.card.is-empty{
  flex-direction:column; align-items:center; justify-content:center;
  gap:8px;
  background: transparent;
  border: 1.5px dashed var(--hairline);
  box-shadow:none;
  padding:18px 14px;
}
.card.is-empty:hover{ border-color: var(--ink-faint); background: rgba(0,0,0,.015); box-shadow:none; }
.empty-slot-icon{
  width:30px; height:30px; border-radius:50%;
  border:1.5px dashed var(--hairline);
  display:flex; align-items:center; justify-content:center;
  color: var(--ink-faint);
}
.empty-slot-icon svg{ width:16px; height:16px; }

/* ---------- add project tile ---------- */
.add-project-tile{
  grid-column: 1 / -1;
  flex-direction:row; align-items:center; justify-content:center;
  gap:6px; background: transparent; border: 1.5px dashed var(--hairline);
  box-shadow:none; padding:10px; margin-top:2px; min-height:0; height:38px;
  cursor:pointer; opacity:.6;
  font-family: var(--font); color: var(--ink-faint);
  transition: border-color 140ms var(--ease), background 140ms var(--ease), color 140ms var(--ease), opacity 140ms var(--ease);
}
.add-project-tile:hover{ opacity:1; border-color: var(--blue); background: rgba(46,94,61,.04); color: var(--blue); }
.add-project-tile svg{ width:14px; height:14px; }
.add-project-tile span{ font-size:11px; font-weight:600; }

/* ---------- divider before the 7th+ project ---------- */
.grid-extra-divider{
  grid-column: 1 / -1;
  display:flex; align-items:center; gap:10px;
  margin:4px 2px -2px;
}
.grid-extra-divider::before, .grid-extra-divider::after{
  content:''; flex:1; height:0; border-top:1.5px dashed var(--hairline);
}
.grid-extra-divider span{
  font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color: var(--ink-faint); white-space:nowrap;
}

/* ---------- completed projects archive ---------- */
.completed-section{ margin: 28px 28px 20px; }
.completed-divider{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.completed-divider::before, .completed-divider::after{
  content:''; flex:1; height:0; border-top:1.5px dashed var(--hairline);
}
.completed-divider span{
  font-size:10.5px; font-weight:700; letter-spacing:.08em;
  color: var(--ink-faint); white-space:nowrap;
}
.completed-list{ display:flex; flex-direction:column; gap:2px; }
.completed-row{
  display:flex; align-items:center; gap:10px; padding:9px 10px;
  border-radius:10px; cursor:pointer;
  transition: background 140ms var(--ease);
}
.completed-row:hover{ background: rgba(0,0,0,.03); }
.completed-row-icon{
  flex:0 0 auto; width:26px; height:26px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; color:#fff;
  opacity:.7;
}
.completed-row-icon svg{ width:14px; height:14px; }
.completed-row-title{
  flex:1; min-width:0; font-size:13.5px; font-weight:500; color: var(--ink-soft);
  text-decoration: line-through; text-decoration-color: var(--hairline);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.completed-row-check{ flex:0 0 auto; width:15px; height:15px; color: var(--green); }

/* segmented tab control */
.tab-bar{
  display:flex; gap:2px; flex-wrap:wrap;
  margin: 0 28px 4px;
  padding:4px;
  background: rgba(118,118,128,.12);
  border-radius: 22px;
}
.tab-btn{
  flex:1 1 auto;
  font-size:12.5px; font-weight:600;
  padding:8px 10px;
  cursor:pointer;
  border-radius: 18px;
  border:1px solid rgba(0,0,0,.05);
  background: rgba(255,255,255,.45);
  color: var(--ink-soft);
  white-space:nowrap;
  transition: background 180ms var(--ease), color 180ms var(--ease), box-shadow 180ms var(--ease), border-color 180ms var(--ease);
}
.tab-btn:hover{ background: rgba(255,255,255,.7); }
.tab-btn.active{ background:#fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); border-color: transparent; }

.dialog-body{ padding:18px 28px 28px; overflow-y:auto; flex:1; }
.tab-panel{ display:none; animation: fadeUp 240ms var(--ease) both; }
.tab-panel.active{ display:block; }

/* grouped-list panel, iOS settings style */
.group{
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--hairline-soft);
  overflow:hidden;
  margin-bottom:16px;
}
.group-title{
  font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  color: var(--ink-faint); margin: 0 0 8px 4px;
}
.row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--hairline-soft); }
.row:last-child{ border-bottom:none; }

.overview-stats{
  display:flex; align-items:center; justify-content:space-between;
  background: var(--surface); border:1px solid var(--hairline-soft); border-radius: var(--radius-md);
  padding:9px 14px; margin-bottom:16px;
}
.stat-item{ display:flex; align-items:baseline; gap:5px; }
.stat-sep{ width:1px; height:14px; background: var(--hairline); flex:0 0 auto; }
.stat-item .num{ font-size:14px; font-weight:800; letter-spacing:-0.01em; }
.stat-item .lbl{ font-size:10.5px; color: var(--ink-soft); font-weight:600; }

.big-progress{ display:flex; flex-direction:column; gap:10px; background: var(--surface); border:1px solid var(--hairline-soft); border-radius: var(--radius-lg); padding:16px 18px; margin-bottom:16px; }
.big-progress-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.big-progress-top .t1{ font-size:14px; font-weight:700; }
.t1-num{ font-size:23px; font-weight:800; letter-spacing:-0.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
.big-progress-top .t1-sub{ font-size:11.5px; font-weight:500; color: var(--ink-soft); }
.lv-progress .t1-sub{ font-size:10px; }
.hp-progress .t1-sub{ font-size:10px; }
.big-progress-top .pct-lg{ font-size:24px; font-weight:800; font-style:italic; letter-spacing:-0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat-inline{ display:flex; align-items:baseline; gap:5px; flex:0 0 auto; }
.stat-inline .num{ font-size:14px; font-weight:800; letter-spacing:-0.01em; color: var(--ink); }
.stat-inline .lbl{ font-size:10px; color: var(--ink-soft); font-weight:600; }
.big-progress .hp-track{ height:14px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
.big-progress-text .t2{ font-size:12.5px; color: var(--ink-soft); }

/* ---------- editable free-text fields (Overview summary / Notes) ---------- */
.edit-field-wrap{ margin-bottom:4px; }
.edit-textarea{
  width:100%; resize:vertical; min-height:80px;
  font-family: var(--font); font-size:14.5px; line-height:1.7; color: var(--ink);
  padding:14px 16px; background: var(--surface); border:1px solid var(--hairline-soft); border-radius: var(--radius-lg);
  outline:none; transition: border-color 140ms var(--ease);
}
.edit-textarea:focus{ border-color: var(--blue); }
.edit-textarea::placeholder{ color: var(--ink-faint); }

/* ---------- editable lists (Milestones / Timeline) ---------- */
.edit-list-wrap{ background: var(--surface); border:1px solid var(--hairline-soft); border-radius: var(--radius-lg); padding:10px; }
.edit-list{ display:flex; flex-direction:column; gap:7px; margin-bottom:8px; }
.edit-empty{ font-size:13px; color: var(--ink-faint); font-style:italic; padding:8px 6px; }

/* ---------- milestones: calendar + list side by side ---------- */
.ms-split{ display:flex; gap:14px; align-items:flex-start; }
.ms-split-cal{ flex:0 0 260px; }
.ms-split-list{ flex:1; min-width:0; }
@media (max-width:640px){
  .ms-split{ flex-direction:column; }
  .ms-split-cal{ flex:none; width:100%; }
  .ms-split-list{ width:100%; }
}

/* ---------- milestone calendar ---------- */
.cal-wrap{ background: var(--surface); border:1px solid var(--hairline-soft); border-radius: var(--radius-lg); padding:14px; }
.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-nav-btn{
  width:28px; height:28px; border-radius:50%; border:none; cursor:pointer;
  background: rgba(0,0,0,.06); color: var(--ink-soft); font-size:16px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  transition: background 140ms var(--ease);
}
.cal-nav-btn:hover{ background: rgba(0,0,0,.1); }
.cal-month-label{ font-size:14px; font-weight:700; color: var(--ink); }
.cal-weekdays{ display:grid; grid-template-columns: repeat(7,1fr); margin-bottom:4px; }
.cal-weekday{ text-align:center; font-size:10.5px; font-weight:700; color: var(--ink-faint); padding:4px 0; }
.cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:3px; }
.cal-cell{
  aspect-ratio:1; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; cursor:pointer; position:relative;
  transition: background 140ms var(--ease);
}
.cal-cell.cal-empty{ visibility:hidden; cursor:default; }
.cal-cell:not(.cal-empty):not(.has-items):hover{ background: rgba(142,142,147,.12); }
.cal-cell.has-items{ cursor:pointer; background: rgba(46,94,61,.07); }
.cal-cell.has-items:hover{ background: rgba(46,94,61,.13); }
.cal-cell.is-today .cal-daynum{
  background: var(--blue); color:#fff; border-radius:50%;
  width:20px; height:20px; display:flex; align-items:center; justify-content:center;
}
.cal-daynum{ font-size:12px; font-weight:600; color: var(--ink); }
.cal-dots{ display:flex; gap:2px; }
.cal-dot{ width:5px; height:5px; border-radius:50%; background: var(--blue); }
.cal-dot.done{ background: var(--green); }

.edit-row{ display:flex; align-items:center; gap:8px; background: var(--surface-2); border-radius:10px; padding:7px 9px; }
.ms-check{
  width:20px; height:20px; border-radius:50%; flex:0 0 auto;
  border:2px solid var(--hairline); background:#fff; cursor:pointer;
  display:flex; align-items:center; justify-content:center; padding:0;
  color:#fff; font-size:11px; font-weight:800;
  transition: transform 120ms var(--ease), background 120ms var(--ease), border-color 120ms var(--ease);
}
.ms-check:hover{ transform: scale(1.1); }
.ms-check.done{ background: var(--green); border-color: var(--green); }

.timeline-dot{
  width:11px; height:11px; border-radius:50%; flex:0 0 auto; background: var(--blue);
}

.edit-input{
  border:none; outline:none; background:transparent;
  font-family: var(--font); font-size:13.5px; color: var(--ink); padding:4px 2px;
  border-radius:6px;
}
.edit-input:focus{ background: rgba(46,94,61,.07); }
.edit-input.grow{ flex:1; min-width:0; font-weight:500; }
.edit-input.date{ flex:0 0 92px; color: var(--ink-soft); font-size:12px; font-weight:600; }
.edit-input::placeholder{ color: var(--ink-faint); }
.edit-row.done .edit-input.grow{ color: var(--ink-faint); text-decoration: line-through; }

.edit-del{ flex:0 0 auto; width:20px; height:20px; border:none; background:transparent; cursor:pointer; color: var(--ink-faint); font-size:15px; opacity:.5; transition: opacity 140ms var(--ease), color 140ms var(--ease); }
.edit-del:hover{ opacity:1; color: var(--pink); }

.edit-add-row{ display:flex; align-items:center; gap:8px; padding:4px 5px 2px; }
.timeline-footnote-wrap{ padding:14px 6px 2px; }
.timeline-footnote-title{ font-size:11px; font-weight:600; color: var(--ink-soft); margin-bottom:8px; line-height:1.5; }
.timeline-footnote-sub{ display:inline; font-size:10.5px; font-weight:500; color: var(--ink-faint); opacity:.8; margin-top:1px; }
.timeline-footnote-checks{ display:flex; flex-wrap:wrap; gap:14px; }
.tl-log-check{
  display:flex; align-items:center; gap:6px; cursor:pointer;
  font-size:12px; font-weight:600; color: var(--ink-soft);
}
.tl-log-check input[type="checkbox"]{
  width:15px; height:15px; accent-color: var(--blue); cursor:pointer;
}
.edit-add-input{
  border:1px solid var(--hairline); outline:none; background: var(--surface-2);
  font-family: var(--font); font-size:13px; color: var(--ink); border-radius:8px; padding:7px 10px;
  transition: border-color 140ms var(--ease);
}
.edit-add-input:focus{ border-color: var(--blue); }
.edit-add-input.grow{ flex:1; min-width:0; }
.edit-add-input.date{ flex:0 0 130px; }
.edit-add-input::placeholder{ color: var(--ink-faint); }

/* Milestone add row: date field collapsed to a calendar icon button */
.edit-add-input.date.icon-date{
  flex:0 0 26px; width:26px; height:26px; min-width:0; padding:0;
  border-radius:8px; border:none; background: rgba(142,142,147,.1);
  color: transparent; cursor:pointer; position:relative;
  transition: transform 140ms var(--ease), background 140ms var(--ease);
}
.edit-add-input.date.icon-date::before{
  content:"\1F4C5"; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; line-height:1; color: var(--ink-soft); pointer-events:none;
}
.edit-add-input.date.icon-date.has-date{ background: rgba(46,94,61,.14); }
.edit-add-input.date.icon-date.has-date::before{ color: var(--blue); }
.edit-add-input.date.icon-date:hover{ transform: scale(1.08); background: rgba(46,94,61,.12); }
.edit-add-input.date.icon-date:active{ transform: scale(.96); }
.edit-add-input.date.icon-date:focus{ border:none; }
/* hide native text/indicator across engines */
.edit-add-input.date.icon-date::-webkit-datetime-edit,
.edit-add-input.date.icon-date::-webkit-inner-spin-button,
.edit-add-input.date.icon-date::-webkit-clear-button{ display:none; }
.edit-add-input.date.icon-date::-webkit-calendar-picker-indicator{
  position:absolute; inset:0; width:100%; height:100%;
  margin:0; padding:0; opacity:0; cursor:pointer;
}
.edit-add-btn{
  flex:0 0 auto; width:26px; height:26px; border-radius:8px; border:none; cursor:pointer;
  background: rgba(142,142,147,.1); color: var(--ink-soft); font-size:14px; font-weight:700; line-height:1;
  transition: transform 140ms var(--ease), background 140ms var(--ease), color 140ms var(--ease);
}
.edit-add-btn:hover{ transform: scale(1.08); background: rgba(46,94,61,.12); color: var(--blue); }
.edit-add-btn:active{ transform: scale(.96); }

/* ---------- Eisenhower "To-Do" quadrant matrix ---------- */
.quad-summary{ font-size:13px; color: var(--ink-soft); font-weight:600; margin-bottom:12px; text-align:right; }
.quad-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
@media (max-width:640px){ .quad-grid{ grid-template-columns: 1fr; } }

.quad-panel{ border-radius: var(--radius-lg); padding:16px; display:flex; flex-direction:column; min-height:160px; border:1px solid var(--hairline-soft); transition: box-shadow 160ms var(--ease), background 160ms var(--ease); }
.quad-panel.q-blue{   background: rgba(46,94,61,.06); }
.quad-panel.q-pink{   background: rgba(176,80,58,.06); }
.quad-panel.q-orange{ background: rgba(255,159,10,.08); }
.quad-panel.q-gray{   background: rgba(142,142,147,.08); }
.quad-panel.drop-hover{ box-shadow: inset 0 0 0 2.5px var(--blue); background: rgba(46,94,61,.1); }

.quad-panel.quad-completed{
  grid-column: 1 / -1;
  margin-top:4px;
  min-height:0;
  background: rgba(126,169,127,.05);
}
.quad-panel.quad-completed.drop-hover{ box-shadow: inset 0 0 0 2.5px var(--green); background: rgba(126,169,127,.12); }
.quad-completed-list{ flex-direction:row; flex-wrap:wrap; margin-bottom:0; }
.quad-completed-list .quad-item{ flex:0 0 auto; }
.quad-completed-list .quad-empty{ width:100%; }

.quad-head{ margin-bottom:10px; }
.quad-label{ display:block; font-size:13.5px; font-weight:700; letter-spacing:.04em; color: var(--ink); }
.quad-sub{ display:block; font-size:10.5px; font-weight:400; letter-spacing:0; color: var(--ink-faint); margin-top:2px; }

.quad-list{ display:flex; flex-direction:column; gap:4px; flex:1; margin-bottom:10px; }

/* Time HP — not an achievement rate. It reflects how urgent the nearest
   upcoming (or most overdue) unfinished milestone is. Nothing pending
   soon reads as healthy; a blown deadline reads as critical, no matter
   how much other work is done. Boundaries below extend the "5+ days
   overdue" floor downward through longer overdue stretches too, since
   HP dropping back up the longer something is overdue wouldn't make sense. */
function timeHPFromDays(daysUntil){
  if(daysUntil >= 15) return { hp:90, tier:'green' };
  if(daysUntil >= 8)  return { hp:80, tier:'green' };
  if(daysUntil >= 4)  return { hp:60, tier:'yellow' };
  if(daysUntil >= 2)  return { hp:50, tier:'yellow' };
  if(daysUntil === 1) return { hp:40, tier:'yellow' };
  if(daysUntil === 0) return { hp:30, tier:'yellow' };
  if(daysUntil >= -2) return { hp:20, tier:'red' };
  if(daysUntil === -3) return { hp:10, tier:'red' };
  return { hp:0, tier:'darkred' }; // 4+ days overdue
}

function hpMiniHTML(lvPct, hpResult){
  const hp = hpResult ? hpResult.hp : null;
  const tier = hpResult ? hpResult.tier : 'empty';
  const target = hp === null ? 0 : hp;
  return `
    <div class="hp-mini">
      <div class="hp-pct">${lvLabel(lvPct)}</div>
      <div class="hp-track${hp===null?' hp-track-empty':''}">
        <div class="hp-fill hp-${tier}" style="width:0%" data-target="${target}"></div>
      </div>
    </div>
  `;
}

/* =========================================================
   TODO STATE — Eisenhower matrix (urgent/important quadrants),
   variable number of items per quadrant, lives in the detail
   panel and persists to localStorage.
   ========================================================= */
const QUAD_KEY = 'projects_quadrant_state_v2';
const QUAD_DEFS = [
  { id:'q1', label:'NOW',   sub:'緊急かつ重要' },
  { id:'q2', label:'GROW',  sub:'重要だけど緊急じゃない' },
  { id:'q3', label:'QUICK', sub:'緊急だけど重要じゃない' },
  { id:'q4', label:'LATER', sub:'緊急でも重要でもない' },
];
const QUAD_WEIGHT = { q1:4, q2:3, q3:2, q4:1 };
const WEIGHT_TO_QUAD = { 4:'q1', 3:'q2', 2:'q3', 1:'q4' };
// how far along a project "should" be, given its status — the same
// judgment used to color-code Behind/On Track/Ahead.
const STATUS_EXPECTED_PCT = { 'Ahead':90, 'On Track':55, 'Behind':20 };
function itemWeight(it){ return typeof it.weight === 'number' ? it.weight : 2; }

function loadQuadState(){
  try{ const raw = localStorage.getItem(QUAD_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveQuadState(state){ try{ localStorage.setItem(QUAD_KEY, JSON.stringify(state)); }catch(e){} }

let uidCounter = 1;
function nextUid(){ return 'i' + (uidCounter++) + '-' + Date.now().toString(36); }

function defaultQuadrantsFor(p){
  const buckets = { q1:[], q2:[], q3:[], q4:[], completed:[] };
  const map = { high:'q1', mid:'q2', low:'q3' };
  const ratio = (STATUS_EXPECTED_PCT[p.status] ?? 50) / 100;
  const doneCount = Math.round(p.tasks.length * ratio);
  p.tasks.forEach((t,i)=>{
    const q = map[t.p] || 'q3';
    buckets[q].push({ id: nextUid(), text: t.n, done: i < doneCount, weight: QUAD_WEIGHT[q] });
  });
  return buckets;
}

let quadState = loadQuadState();
PROJECTS.forEach(p=>{
  const s = quadState[p.id];
  if(!s || !s.q1 || !s.q2 || !s.q3 || !s.q4){
    quadState[p.id] = defaultQuadrantsFor(p);
  } else {
    // migrate older saved data: add the completed bucket and per-item weights if missing
    if(!s.completed) s.completed = [];
    ['q1','q2','q3','q4'].forEach(qid=>{
      s[qid].forEach(it=>{ if(typeof it.weight !== 'number') it.weight = QUAD_WEIGHT[qid]; });
    });
    s.completed.forEach(it=>{ if(typeof it.weight !== 'number') it.weight = 2; });
  }
});
saveQuadState(quadState);

function quadCounts(id){
  const s = quadState[id];
  const all = [...s.q1, ...s.q2, ...s.q3, ...s.q4, ...s.completed];
  return { done: all.filter(i=>i.done).length, total: all.length };
}
// Lv. is weighted by which area a task belongs (or belonged) to:
// Now counts 4x, Grow 3x, Quick 2x, Later 1x — so finishing higher-priority
// work moves the needle more, while 100% completion always still reads Lv.100.
// Lv. is To-Do-only. The HP bar is a separate metric driven by milestones —
// the two numbers are intentionally independent, like a game character's
// Level vs. their current HP.
function quadProgress(id){
  const s = quadState[id];
  const todos = [...s.q1, ...s.q2, ...s.q3, ...s.q4, ...s.completed];
  if(todos.length === 0) return null;
  let totalW = 0, doneW = 0;
  todos.forEach(it=>{
    const w = itemWeight(it);
    totalW += w;
    if(it.done) doneW += w;
  });
  if(totalW === 0) return null;
  return Math.round((doneW/totalW)*100);
}
// Time HP looks at the single nearest unfinished milestone (soonest
// upcoming, or most overdue if any are already past due) and maps its
// distance from today through the table above. No milestones pending
// at all reads as the best possible state — "Ahead".
function milestoneProgress(id){
  const items = (typeof milestoneState !== 'undefined' && milestoneState[id]) || [];
  if(items.length === 0) return null;

  const today = new Date();
  today.setHours(0,0,0,0);

  let nearestDays = null;
  items.forEach(m=>{
    if(m.done || !isISODate(m.date)) return;
    const [y,mo,d] = m.date.split('-').map(Number);
    const due = new Date(y, mo-1, d);
    const days = Math.round((due - today) / 86400000);
    if(nearestDays === null || days < nearestDays) nearestDays = days;
  });

  if(nearestDays === null || nearestDays > 21) return { hp:100, tier:'green' };
  return timeHPFromDays(nearestDays);
}
function lvLabel(pct){ return pct === null ? '–' : 'Lv.' + (pct === 0 ? 1 : pct); }

function updateCardProgress(id){
  const p = PROJECTS.find(x=>x.id===id);
  const cardEl = grid.querySelector(`.card[data-id="${id}"]`);
  if(!p || !cardEl) return;
  const lvPct = quadProgress(id);
  const hpResult = milestoneProgress(id);
  const fill = cardEl.querySelector('.hp-fill');
  const track = cardEl.querySelector('.hp-track');
  const label = cardEl.querySelector('.hp-pct');
  const hp = hpResult ? hpResult.hp : null;
  const tier = hpResult ? hpResult.tier : 'empty';
  fill.className = `hp-fill hp-${tier}`;
  fill.style.width = (hp === null ? 0 : hp) + '%';
  track.classList.toggle('hp-track-empty', hp === null);
  label.textContent = lvLabel(lvPct);

  // the status tag (and card tint) follow HP too, so they stay in sync
  const effectiveStatus = statusFromHPTier(tier);
  const st = statusRule(effectiveStatus);
  cardEl.classList.remove('st-ontrack','st-ahead','st-delayed');
  cardEl.classList.add(st.cls);
  const pill = cardEl.querySelector('.status-pill');
  if(pill){
    pill.classList.remove('st-ontrack','st-ahead','st-delayed');
    pill.classList.add(st.cls);
    pill.textContent = effectiveStatus;
  }

  cardEl.classList.add('pulse-update');
  setTimeout(()=> cardEl.classList.remove('pulse-update'), 420);
}

/* =========================================================
   PROJECT DELETION — the card frame stays in the grid, but
   all of its content (title, icon, tasks, notes, timeline,
   milestones) is cleared. Setting a new title later revives it.
   ========================================================= */
const EMPTY_SLOT_LABEL = '';

function isProjectDeleted(id){
  return !!(projectMeta[id] && projectMeta[id].deleted);
}

function deleteProjectContents(id){
  const idx = PROJECTS.findIndex(x=>x.id===id);
  if(idx === -1) return;
  const p = PROJECTS[idx];

  if(milestoneState[id]) delete milestoneState[id];
  if(timelineState[id]) delete timelineState[id];
  if(quadState[id]) delete quadState[id];
  saveMilestoneState(milestoneState);
  saveTimelineState(timelineState);
  saveQuadState(quadState);

  if(p.custom){
    // custom (7th+) projects have no fixed slot to preserve — remove entirely
    PROJECTS.splice(idx, 1);
    delete projectMeta[id];
    saveMeta(projectMeta);
    saveCustomProjects();
  } else {
    // one of the original 6 — clear contents but keep the revivable empty slot
    p.title = EMPTY_SLOT_LABEL;
    p.icon = 'globe';
    projectMeta[id] = { deleted:true, title:EMPTY_SLOT_LABEL, icon:'globe', summary:'', notes:'' };
    saveMeta(projectMeta);
    milestoneState[id] = [];
    timelineState[id] = [];
    quadState[id] = { q1:[], q2:[], q3:[], q4:[], completed:[] };
    saveMilestoneState(milestoneState);
    saveTimelineState(timelineState);
    saveQuadState(quadState);
  }

  renderGrid();
}

/* =========================================================
   PROJECT COMPLETION — archives a project out of the active
   grid into a simple accumulating list below it. Reversible.
   ========================================================= */
function isProjectCompleted(id){
  return !!(projectMeta[id] && projectMeta[id].completed);
}
function setProjectCompleted(id, val){
  projectMeta[id] = { ...(projectMeta[id]||{}), completed: val };
  saveMeta(projectMeta);
  renderGrid();
}

function createNewProject(){
  const id = 'p' + nextUid();
  const accent = ACCENT_CYCLE[PROJECTS.length % ACCENT_CYCLE.length];
  const p = {
    id, title:'New Project', status:'On Track', accent, icon:'star',
    deadline:'', updated:'', overview:'', tasks:[], milestones:[], timeline:[], resources:[], gallery:[],
    custom:true,
  };
  PROJECTS.push(p);
  quadState[id] = defaultQuadrantsFor(p);
  milestoneState[id] = [];
  timelineState[id] = [];
  saveQuadState(quadState);
  saveMilestoneState(milestoneState);
  saveTimelineState(timelineState);
  saveCustomProjects();
  renderGrid();
  return id;
}

   ========================================================= */
const ORDER_KEY = 'projects_order_v1';
function loadOrder(){
  try{ const raw = localStorage.getItem(ORDER_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveOrder(){
  try{ localStorage.setItem(ORDER_KEY, JSON.stringify(PROJECTS.map(p=>p.id))); }catch(e){}
}
(function applyStoredOrder(){
  const order = loadOrder();
  if(!order) return;
  const byId = new Map(PROJECTS.map(p=>[p.id,p]));
  const ordered = order.map(id=>byId.get(id)).filter(Boolean);
  order.forEach(id=>byId.delete(id));
  const remaining = PROJECTS.filter(p=>byId.has(p.id));
  PROJECTS.length = 0;
  PROJECTS.push(...ordered, ...remaining);
})();

/* =========================================================
   RENDER — home grid
   ========================================================= */
const grid = document.getElementById('grid');

const STATUS_RULES = {
  'On Track': { cls:'st-ontrack' },
  'Ahead':    { cls:'st-ahead'   },
  'Behind':   { cls:'st-delayed' },
};
function statusRule(status){ return STATUS_RULES[status] || STATUS_RULES['On Track']; }

// The status tag is no longer a fixed field — it's derived live from HP
// (the nearest-milestone urgency): green = Ahead, yellow =
// On Track, red/dark red = Behind.
function statusFromHPTier(tier){
  if(tier === 'green') return 'Ahead';
  if(tier === 'yellow') return 'On Track';
  if(tier === 'red' || tier === 'darkred') return 'Behind';
  return 'On Track';
}
function getEffectiveStatus(id){
  const hpResult = milestoneProgress(id);
  return statusFromHPTier(hpResult ? hpResult.tier : 'empty');
}

function renderGrid(){
  grid.innerHTML = '';
  const activeList = PROJECTS.filter(p=> !isProjectCompleted(p.id));
  const completedList = PROJECTS.filter(p=> !isProjectDeleted(p.id) && isProjectCompleted(p.id));

  const filledCount = activeList.filter(p=> !isProjectDeleted(p.id)).length;
  const countLabel = document.getElementById('activeCountLabel');
  if(countLabel && currentPage !== 'alltodos'){
    countLabel.textContent = 'Your highest priorities';
  }

  activeList.forEach((p, i)=>{
    if(i === 6){
      const divider = document.createElement('div');
      divider.className = 'grid-extra-divider';
      divider.innerHTML = `<span>追加のプロジェクト</span>`;
      grid.appendChild(divider);
    }

    const el = document.createElement('div');
    el.dataset.id = p.id;

    if(isProjectDeleted(p.id)){
      el.className = 'card is-empty';
      el.innerHTML = `
        <div class="empty-slot-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      `;
      el.addEventListener('click', ()=>{
        if(cardJustDragged) return;
        openDetail(p.id);
      });
      grid.appendChild(el);
      return;
    }

    const lvPct = quadProgress(p.id);
    const hpResult = milestoneProgress(p.id);
    const effectiveStatus = statusFromHPTier(hpResult ? hpResult.tier : 'empty');
    const st = statusRule(effectiveStatus);

function collectAllTodosFor(qid){

function renderAllTodosView(){
  const body = document.getElementById('alltodosBody');
  if(!body) return;

  document.querySelectorAll('.alltodos-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.mode === alltodosMode);
  });

  if(alltodosMode === 'all'){
    body.innerHTML = `
      <div class="alltodos-grid4">
        ${['q1','q2','q3','q4'].map(qid=>{
          const rows = collectAllTodosFor(qid);
          return `
            <div class="alltodos-quad-panel">
              <div class="alltodos-quad-title">${QUAD_LABELS[qid]}</div>
              <div class="alltodos-big-list">
                ${rows.length ? rows.map(alltodosItemHTML).join('') : `<div class="alltodos-empty">なし</div>`}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  } else {
    const rows = collectAllTodosFor(alltodosMode);
    body.innerHTML = `
      <div class="alltodos-big-list">
        ${rows.length ? rows.map(alltodosItemHTML).join('') : `<div class="alltodos-empty">タスクがありません</div>`}
      </div>
    `;
  }

  body.querySelectorAll('.alltodos-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const textEl = e.target.closest('[data-action="alltodos-edit-text"]');
      if(textEl){
        e.stopPropagation();
        startAllTodosTextEdit(textEl, el.dataset.project, el.dataset.qid, el.dataset.item);
        return;
      }
      const pid = el.dataset.project, qid = el.dataset.qid, iid = el.dataset.item;

      if(e.target.closest('[data-action="alltodos-toggle"]')){
        e.stopPropagation();
        const arr = (quadState[pid] && quadState[pid][qid]) || [];
        const it = arr.find(i=>i.id===iid);
        if(it){
          it.done = !it.done;
          saveQuadState(quadState);
          syncProjectViewsAfterQuadChange(pid);
          renderAllTodosView();
        }
        return;
      }

      if(e.target.closest('[data-action="alltodos-complete"]')){
        e.stopPropagation();
        const arr = (quadState[pid] && quadState[pid][qid]) || [];
        const idx = arr.findIndex(i=>i.id===iid);
        if(idx > -1){
          const [moved] = arr.splice(idx, 1);
          moved.done = true; // weight stays frozen from its last active quadrant
          if(!quadState[pid].completed) quadState[pid].completed = [];
          quadState[pid].completed.push(moved);
          saveQuadState(quadState);
          logCompletionToTimeline(pid, moved.text, qid);
          syncProjectViewsAfterQuadChange(pid);
          renderAllTodosView();
        }
        return;
      }

      if(el.querySelector('.alltodos-text-input')) return;
      openDetail(el.dataset.project);
      requestAnimationFrame(()=>{
        const todoTabBtn = tabBar.querySelector('.tab-btn[data-tab="To-Do"]');
        if(todoTabBtn) todoTabBtn.click();
      });
    });
  });
}

/* =========================================================
   MILESTONES (state only) — moved ahead of renderGrid() since
   milestoneProgress() reads milestoneState for the HP bar.
   ========================================================= */
const MILESTONE_KEY = 'projects_milestones_v1';
const MONTH_ABBR = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function isISODate(str){ return typeof str === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(str); }
function parseLooseDateToISO(str, assumedYear){
  if(!str) return '';
  if(isISODate(str)) return str;
  const m = str.trim().match(/^([A-Za-z]{3})[a-z]*\s+(\d{1,2})/);
  if(m && MONTH_ABBR[m[1]] !== undefined){
    const mo = MONTH_ABBR[m[1]];
    const day = parseInt(m[2],10);
    const y = assumedYear || new Date().getFullYear();
    return `${y}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  return '';
}
function formatISODate(iso){
  if(!isISODate(iso)) return iso || '';
  const [y,mo,d] = iso.split('-').map(Number);
  return `${MONTH_NAMES[mo-1].slice(0,3)} ${d}`;
}

function loadMilestoneState(){
  try{ const raw = localStorage.getItem(MILESTONE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {};
}
function saveMilestoneState(state){ try{ localStorage.setItem(MILESTONE_KEY, JSON.stringify(state)); }catch(e){} }
function defaultMilestonesFor(p){
  return (p.milestones||[]).map(m=>({ id: nextUid(), text: m.t, date: parseLooseDateToISO(m.d, 2026), done: !!m.done }));
}

  } else {
    milestoneState[p.id].forEach(it=>{
      if(it.date && !isISODate(it.date)) it.date = parseLooseDateToISO(it.date, 2026);
    });
  }
});

/* ---------- custom confirm dialog (native confirm()/alert() are blocked in sandboxed previews) ---------- */
const confirmOverlay = document.getElementById('confirmOverlay');

const confirmMsg = document.getElementById('confirmMsg');
const confirmOkBtn = document.getElementById('confirmOkBtn');
const confirmCancelBtn = document.getElementById('confirmCancelBtn');

function customConfirm(message){
  return new Promise(resolve=>{
    confirmMsg.textContent = message;
    confirmOverlay.classList.add('open');

    function cleanup(result){
      confirmOverlay.classList.remove('open');
      confirmOkBtn.removeEventListener('click', onOk);
      confirmCancelBtn.removeEventListener('click', onCancel);
      confirmScrim.removeEventListener('click', onCancel);
      document.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    function onKey(e){ if(e.key === 'Escape') cleanup(false); }

    confirmOkBtn.addEventListener('click', onOk);
    confirmCancelBtn.addEventListener('click', onCancel);
    confirmScrim.addEventListener('click', onCancel);
    document.addEventListener('keydown', onKey);
  });
}

/* =========================================================
   IME-SAFE EDITING — on Mac/Japanese IME, selecting a kanji
   conversion candidate (by click or by Enter) can cause the
   input to blur for an instant, or fires a keydown Enter that
   is meant for the IME, not for us. Naively treating that as
   "finish editing" destroys the input mid-composition. This
   helper guards both cases for every inline edit field below.
   ========================================================= */
function bindImeSafeCommit(input, commit){
  let blurTimer = null;
  input.addEventListener('blur', ()=>{
    blurTimer = setTimeout(()=>{
      blurTimer = null;
      if(document.activeElement !== input) commit();
    }, 150); // give a transient IME-related blur a chance to self-correct
  });
  input.addEventListener('focus', ()=>{
    if(blurTimer){ clearTimeout(blurTimer); blurTimer = null; }
  });
}
function isImeConfirmKeydown(e){
  return e.isComposing || e.keyCode === 229; // 229 = legacy IME-composition signal
}

    if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
    if(e.key === 'Escape'){ e.preventDefault(); committed = true; refreshTimelineTab(id); }
  });
  input.addEventListener('click', e=> e.stopPropagation());
}

/* ---------- icon picker popover (shared by card & dialog) ---------- */
function openIconPopover(anchorEl, id){
  const p = PROJECTS.find(x=>x.id===id);
  const currentColor = getIconColor(p);
  iconPopoverGrid.style.setProperty('--swatch-accent', ACCENT_HEX[p.accent]);
  iconPopoverGrid.innerHTML = ICON_KEYS.map(key=>`
    <button class="icon-swatch${key===p.icon?' selected':''}" type="button" data-icon="${key}" aria-label="${key}">${iconSVG(key)}</button>
  `).join('');

  const recentColors = loadRecentColors();
  iconColorRow.innerHTML = COLOR_PRESETS.map(c=>`
    <button class="color-swatch${c.toLowerCase()===currentColor.toLowerCase()?' selected':''}" type="button" data-color="${c}" style="background:${c}" aria-label="color"></button>
  `).join('') + `
    <label class="color-swatch color-swatch-custom" aria-label="custom color">
      <input type="color" class="color-native-input" value="${currentColor}">
    </label>
  ` + [0,1,2,3,4].map(i=>{
    const c = recentColors[i];
    if(!c) return `<span class="color-swatch color-swatch-empty" aria-hidden="true"></span>`;
    return `<button class="color-swatch${c.toLowerCase()===currentColor.toLowerCase()?' selected':''}" type="button" data-color="${c}" style="background:${c}" aria-label="recent color"></button>`;
  }).join('');

  const rect = anchorEl.getBoundingClientRect();
  const popW = 254;
  let left = rect.left;
  if(left + popW > window.innerWidth - 12) left = window.innerWidth - popW - 12;
  iconPopover.style.left = left + 'px';
  iconPopover.style.top = (rect.bottom + 8) + 'px';
  iconPopover.classList.add('open');
  iconPopover.dataset.projectId = id;

  requestAnimationFrame(()=>{
    const pr = iconPopover.getBoundingClientRect();
    if(pr.bottom > window.innerHeight - 12){
      iconPopover.style.top = Math.max(12, rect.top - pr.height - 8) + 'px';
    }
  });

  iconPopoverGrid.querySelectorAll('.icon-swatch').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      setProjectIcon(id, btn.dataset.icon);
      closeIconPopover();
    };
  });

  iconColorRow.querySelectorAll('.color-swatch[data-color]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      setProjectIconColor(id, btn.dataset.color);
      iconColorRow.querySelectorAll('.color-swatch').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });
  const nativeInput = iconColorRow.querySelector('.color-native-input');
  if(nativeInput){
    nativeInput.addEventListener('click', e=> e.stopPropagation());
    nativeInput.addEventListener('input', (e)=>{
      setProjectIconColor(id, e.target.value);
      iconColorRow.querySelectorAll('.color-swatch[data-color]').forEach(b=>b.classList.remove('selected'));
    });
    nativeInput.addEventListener('change', (e)=>{
      pushRecentColor(e.target.value);
      openIconPopover(anchorEl, id); // re-render so the new pick appears in the recent-colors row
    });
  }
}
function closeIconPopover(){ iconPopover.classList.remove('open'); }
document.addEventListener('click', (e)=>{

          <div class="hp-fill hp-${tier}" style="width:0%" data-target="${hp===null?0:hp}"></div>

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function refreshQuadrantTab(id){
  const panel = dialogBody.querySelector('.tab-panel[data-tab="To-Do"]');
  if(panel) panel.innerHTML = buildQuadrantHTML(id);
  updateCardProgress(id);
  refreshOverviewStatsOnly(id);
}

dialogBody.addEventListener('click', (e)=>{
  const addBtn = e.target.closest('[data-action="add"]');
  const toggleBtn = e.target.closest('[data-action="toggle"]');
  const delBtn = e.target.closest('[data-action="delete-direct"]');
  const completeBtn = e.target.closest('[data-action="complete-direct"]');
  const editTrigger = e.target.closest('[data-action="edit-inline"]');
  if(!addBtn && !toggleBtn && !delBtn && !completeBtn && !editTrigger) return;

  const panelEl = e.target.closest('.quad-panel');
  if(!panelEl) return;
  const id = panelEl.dataset.project;

  if(addBtn){
    const qid = panelEl.dataset.quad;
    if(!qid) return;
    const input = panelEl.querySelector('.quad-add-input');
    const text = input.value.trim();
    if(!text) return;
    quadState[id][qid].push({ id: nextUid(), text, done:false, weight: QUAD_WEIGHT[qid] });
    saveQuadState(quadState);
    refreshQuadrantTab(id);
    const newInput = dialogBody.querySelector(`.quad-panel[data-quad="${qid}"] .quad-add-input`);
    if(newInput) newInput.focus();
    return;
  }
  if(toggleBtn){
    const itemEl = e.target.closest('.quad-item');
    const qid = itemEl.dataset.quad;
    const arr = quadState[id][qid];
    const idx = arr ? arr.findIndex(i=>i.id===itemEl.dataset.item) : -1;
    if(idx > -1){
      const item = arr[idx];
      if(qid === 'completed' && item.done){
        // unchecking inside Completed — send it back to the quadrant its weight came from
        const targetQid = WEIGHT_TO_QUAD[item.weight] || 'q3';
        const [moved] = arr.splice(idx, 1);
        moved.done = false;
        quadState[id][targetQid].push(moved);
      } else {
        item.done = !item.done;
      }
      saveQuadState(quadState);
      refreshQuadrantTab(id);
    }
    return;
  }
  if(completeBtn){
    const itemEl = e.target.closest('.quad-item');
    const qid = itemEl.dataset.quad;
    const arr = quadState[id][qid];
    if(arr && qid !== 'completed'){
      const idx = arr.findIndex(i=>i.id===itemEl.dataset.item);
      if(idx > -1){
        const [moved] = arr.splice(idx, 1);
        moved.done = true; // weight stays frozen from its last active quadrant
        quadState[id].completed.push(moved);
        saveQuadState(quadState);
        logCompletionToTimeline(id, moved.text, qid);
        refreshQuadrantTab(id);
      }
    }
    return;
  }
  if(delBtn){
    const itemEl = e.target.closest('.quad-item');
    const qid = itemEl.dataset.quad;
    if(quadState[id][qid]){
      quadState[id][qid] = quadState[id][qid].filter(i=>i.id!==itemEl.dataset.item);
      saveQuadState(quadState);
      refreshQuadrantTab(id);
    }
    return;
  }
  if(editTrigger){
    const itemEl = e.target.closest('.quad-item');
    const qid = itemEl.dataset.quad;
    startQuadInlineEdit(editTrigger, id, qid, itemEl.dataset.item);
    return;
  }
});
dialogBody.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && e.target.classList.contains('quad-add-input')){
    e.preventDefault();
    e.target.closest('.quad-panel').querySelector('[data-action="add"]').click();
  }
});
